[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generator"
version = "1.0.0"
description = "A tiny static blog generator based on Markdown and Jinja2"
requires-python = ">=3.8"
dependencies = [
    "Jinja2>=3.0",
    "Pygments",
    "marko",
    "watchdog",
    "pyyaml",
    "smartypants>=2.0.2",
]

[project.scripts]
build-blog = "generator.commands:main_build"
serve-blog = "generator.commands:main_serve"

[tool.hatch.build.targets.wheel]
packages = ["generator"]
