<div class="pagination">
  {% if pagination.has_prev %}
  <a class="pagination-link" href="{{ link_to('page', slug='/' if pagination.prev_page == 1 else '/page/%d/' % pagination.prev_page) }}">&laquo; 上一页</a>
  {% else %}
  <span class="pagination-disabled">&laquo; 上一页</span>
  {% endif %}
  <span class="pagination-current">{{ pagination.page }} / {{ pagination.pages }}</span>
  {% if pagination.has_next %}
  <a class="pagination-link" href="{{ link_to('page', slug='/page/%d/' % pagination.next_page) }}">下一页 &raquo;</a>
  {% else %}
  <span class="pagination-disabled">下一页 &raquo;</span>
  {% endif %}
</div>
