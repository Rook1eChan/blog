{% extends "layout.html" %}
{% block title %}标签 Tags | {{ config.site_title }}{% endblock %}
{% block body %}
<h1>标签 Tags</h1>
<p class="archive-hint"><a href="{{ link_to('archive') }}">按时间浏览 →</a></p>
<ul class="tagcloud">
  {% for tag in get_tags(limit=100) %}
  <li><a href="{{ link_to('tag', tag=tag.name) }}"
         style="font-size: {{ tag.size }}%"
         data-count="{{ tag.count }}">#{{ tag.name }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
